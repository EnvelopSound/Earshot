daemon off;

error_log /dev/stdout info;

user nginx;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen ${RTMP_PORT};
        chunk_size 4000;
        notify_method get;
        # 4K (and larger) H.264 keyframes can exceed nginx-rtmp's 1 MB default
        # max_message, which drops the publish with "too big message" before
        # ffmpeg ever sees a frame. Raise it well above a realistic keyframe size.
        max_message 10M;

        application live {
            live on;
            # Start the exec'd transcoder's input at a keyframe with audio held
            # until video flows, so both tracks begin together. Without these,
            # the subscriber gets audio up to one GOP before decodable video and
            # ffmpeg records that skew as a leading empty edit on the video
            # track, which desyncs players that drop edit lists in MSE.
            wait_key on;
            wait_video on;
            on_publish http://127.0.0.1/route_to_auth;
            # $name (the publish name) stays on -i only; the manifest path uses
            # ${DASH_NAME} instead, so the output location does not move when
            # the publish name changes (e.g. a rotated stream key). Must stay
            # identical to the exec line in nginx-no-ssl.conf.
            exec ffmpeg -analyzeduration 10M -i rtmp://127.0.0.1/live/$name -strict -2 -c:a libopus -mapping_family 255 ${FFMPEG_FLAGS} -f dash /opt/data/dash/${DASH_NAME}.mpd 2>>/tmp/nginx_rtmp_ffmpeg_log;
        }
    }
}

http {
    access_log /dev/stdout combined;

    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_protocols       TLSv1 TLSv1.1 TLSv1.2;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    include mime.types;
    sendfile on;

    limit_req_zone $arg_addr zone=antiBruteForce:100k rate=1r/s;
    limit_req_status 401;

    server {
        # Emit RELATIVE redirects. Otherwise nginx rebuilds a directory redirect
        # (e.g. /webtools -> /webtools/) from its internal listen port, dropping
        # any external mapped port when the container is published on a different
        # port (docker -p 8081:80, or behind a reverse proxy / VPN bind) and
        # sending the browser to the wrong URL.
        absolute_redirect off;

        listen ${HTTP_PORT};

        listen 443 ssl;
        ssl_certificate /usr/share/nginx/certificates/fullchain.pem;
        ssl_certificate_key /usr/share/nginx/certificates/privkey.pem;
        include /etc/ssl-options/options-nginx-ssl.conf;
        ssl_dhparam /etc/ssl-options/ssl-dhparams.pem;


        location /.well-known/acme-challenge/ {
          root /var/www/certbot;
        }

        location / {
             if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                #
                # Custom headers and headers various browsers *should* be OK with but aren't
                #
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
                #
                # Tell client that this pre-flight info is valid for 20 days
                #
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
             }
             if ($request_method = 'POST') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
                add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
             }
             if ($request_method = 'GET') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
                add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
             }
        }

        location = / {
            return 200 'Health Check reply';
            # because default content-type is application/octet-stream,
            # browser will offer to "save the file"...
            # if you want to see reply in browser, uncomment next line
            # add_header Content-Type text/plain;
        }
        location /dash {
            types {
                application/dash+xml mpd;
                video/mp4 mp4;
            }
            root /opt/data;

            # The manifest is written as ${DASH_NAME}.mpd, not <publish-name>.mpd,
            # so a request for any other .mpd name would 404. Map it to the real
            # one; segments are referenced relatively, so they resolve unchanged.
            rewrite ^/dash/[^/]+\.mpd$ /dash/${DASH_NAME}.mpd break;

            # modify these if you need different CORS settings
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Expose-Headers Content-Length;
        }

        # check auth token sent by RTMP encoder
        location /auth {
            if ($arg_token = '${RTMP_AUTH_TOKEN}') {
                return 201;
            }
            return 401;
        }

        #forward to custom rtmp auth url
        location /route_to_auth {
            limit_req zone=antiBruteForce burst=2 nodelay;
            allow 127.0.0.1;
            deny all;
            proxy_pass ${RTMP_AUTH_URL};
        }

        location = /crossdomain.xml {
            root /www/static;
            default_type text/xml;
            expires 24h;
        }

        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet static/stat.xsl;
        }

        location /static/ {
            alias /www/static;
        }

        # static nginx runtime info served to webtools
        location /nginxInfo {
            default_type application/json;
            return 200 '{"ffmpegFlags":"${FFMPEG_FLAGS}","dashName":"${DASH_NAME}"}';
        }

        location /webtools {
            root /www;
        }

        # uncomment this and comment above /webtools section for local webtools development / webpack hot reload
        # location /webtools {
        #     proxy_pass http://host.docker.internal:3000;
        #     proxy_redirect off;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        # }

        # location /sockjs-node {
        #     proxy_pass http://host.docker.internal:3000;
        #     proxy_redirect off;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        # }
    }
}
